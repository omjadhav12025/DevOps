- name: Verify Application and Docker Deployment Health
  hosts: local
  gather_facts: yes
  tasks:
    - name: Ensure Docker service is running
      service:
        name: docker
        state: started

    - name: Verify running Docker containers
      command: docker ps
      register: docker_ps_output

    - name: Print Docker container status log
      debug:
        msg: "{{ docker_ps_output.stdout_lines }}"
